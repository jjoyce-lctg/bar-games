<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Call Tavern Games - Prize Redemption</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .wrap { max-width: 560px; margin: 0 auto; padding: 1.2rem 1rem 3rem; }
  .brand { font-family: var(--display); font-size: 1.5rem; letter-spacing: .04em; } .brand span { color: var(--accent); }
  .top { display: flex; align-items: center; gap: .6rem; margin-bottom: 1rem; }
  #phone { font-size: 1.8rem; text-align: center; letter-spacing: .05em; padding: 1rem; }
  .prize { border: 2px solid var(--line); border-radius: 14px; padding: 1rem; }
  .prize.active { border-color: var(--ok); } .prize.redeemed, .prize.expired, .prize.voided { opacity: .75; border-color: var(--danger); } .prize.not_yet { border-color: #d7a500; }
  .prize .big { font-family: var(--display); font-size: 2rem; line-height: 1; }
  .prize .who { font-size: 1.2rem; font-weight: 800; }
  .status { display: inline-block; padding: .25rem .7rem; border-radius: 999px; font-weight: 800; font-size: .85rem; }
  .status.active { background: var(--ok); color: #fff; } .status.redeemed, .status.expired, .status.voided { background: var(--danger); color: #fff; } .status.not_yet { background: #d7a500; color: #111; }
  .btn.redeem { width: 100%; font-size: 1.3rem; padding: 1rem; background: var(--ok); color: #fff; border-color: transparent; }
  .done { text-align: center; padding: 1.5rem; border-radius: 14px; background: rgba(48,164,108,.15); border: 2px solid var(--ok); }
  .done .big { font-family: var(--display); font-size: 3rem; color: #7ee2a8; }
  .login-box { max-width: 420px; margin: 8vh auto 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">LAST CALL <span>TAVERN GAMES</span></div><div class="grow"></div><span id="venuePill" class="venue-pill hidden"></span><button id="btnLogout" class="btn small hidden">Log out</button></div>

  <section id="viewLogin" class="card login-box stack">
    <h1>Prize redemption</h1>
    <p class="muted">Manager login.</p>
    <div id="loginError" class="error hidden"></div>
    <div><label>Username or email</label><input id="username" autocapitalize="none"></div>
    <div><label>Password</label><input id="password" type="password"></div>
    <button id="btnLogin" class="btn primary big" style="width:100%">Log in</button>
  </section>

  <section id="viewVenue" class="card login-box stack hidden">
    <h2>Which bar are you at?</h2>
    <select id="venueSelect"></select>
    <button id="btnVenue" class="btn primary big" style="width:100%">Continue</button>
  </section>

  <section id="viewMain" class="stack hidden">
    <div class="card stack">
      <label>Guest's mobile number</label>
      <input id="phone" type="tel" inputmode="tel" placeholder="(312) 555-0123" autocomplete="off">
      <button id="btnLookup" class="btn primary big" style="width:100%">Look up</button>
      <div id="lookupError" class="error hidden"></div>
    </div>
    <div id="results" class="stack"></div>
    <p class="muted" style="font-size:.8rem">Ask the guest to show the prize text. Prizes are valid from the day after they're won, for 14 days, at any LCTG bar. Each prize redeems once.</p>
  </section>
</div>

<script src="config.js"></script><script src="vendor/supabase.js"></script><script src="common.js"></script>
<script>
(async function () {
  const { api, $, $$, esc, fmtPhone, normPhone } = window.BG;
  let me = null, venue = null, venues = [];
  const fmt = (d) => d ? new Date(d).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
  const fmtDay = (d) => d ? new Date(d).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }) : "";
  const LABEL = { active: "ACTIVE", redeemed: "REDEEMED", expired: "EXPIRED", not_yet: "VALID TOMORROW", voided: "VOIDED" };
  const show = (id) => ["viewLogin", "viewVenue", "viewMain"].forEach((v) => $("#" + v).classList.toggle("hidden", v !== id));

  async function doLogin() {
    const err = $("#loginError"); err.classList.add("hidden");
    try { me = await api.signIn($("#username").value, $("#password").value); await boot(); } catch (e) { err.textContent = e.message; err.classList.remove("hidden"); }
  }
  $("#btnLogin").onclick = doLogin; $("#password").addEventListener("keydown", (e) => e.key === "Enter" && doLogin());
  $("#btnLogout").onclick = async () => { await api.signOut(); location.reload(); };

  async function boot() {
    if (!me || !["manager", "admin"].includes(me.role)) { const err = $("#loginError"); err.textContent = "This login is not a manager."; err.classList.remove("hidden"); await api.signOut(); me = null; show("viewLogin"); return; }
    $("#btnLogout").classList.remove("hidden");
    venues = await api.listVenues();
    const sel = $("#venueSelect"); sel.innerHTML = venues.map((v) => `<option value="${v.id}">${esc(v.name)}</option>`).join("");
    let last = null; try { last = localStorage.getItem("bg.venue"); } catch {} if (last && venues.some((v) => v.id === last)) sel.value = last;
    show("viewVenue");
  }
  $("#btnVenue").onclick = () => { venue = venues.find((v) => v.id === $("#venueSelect").value); try { localStorage.setItem("bg.venue", venue.id); } catch {} $("#venuePill").textContent = venue.name; $("#venuePill").classList.remove("hidden"); show("viewMain"); $("#phone").focus(); };

  $("#phone").addEventListener("input", (e) => { const d = normPhone(e.target.value); if (d.length === 10) e.target.value = fmtPhone(d); });
  $("#phone").addEventListener("keydown", (e) => e.key === "Enter" && lookup());
  $("#btnLookup").onclick = lookup;

  async function lookup() {
    const err = $("#lookupError"); err.classList.add("hidden"); $("#results").innerHTML = "";
    const d = normPhone($("#phone").value);
    if (d.length !== 10) { err.textContent = "Enter the full 10-digit number."; err.classList.remove("hidden"); return; }
    let rows = []; try { rows = await api.lookupPrizes(d); } catch (e) { err.textContent = e.message; err.classList.remove("hidden"); return; }
    if (!rows.length) { $("#results").innerHTML = `<div class="card"><b>No prizes for ${fmtPhone(d)}.</b><p class="muted" style="margin:.4rem 0 0">Check the number against the guest's text. Prizes appear only for winners.</p></div>`; return; }
    $("#results").innerHTML = rows.map((p) => `<div class="prize ${p.status}" data-id="${p.id}">
      <div class="row"><span class="status ${p.status}">${LABEL[p.status] || p.status}</span><div class="grow"></div><span class="muted">${esc(p.won_venue)}, ${fmtDay(p.won_at)}</span></div>
      <div class="who" style="margin-top:.6rem">${esc(p.name)}</div>
      <div class="big">${esc(p.prize)}</div>
      ${p.status === "active" ? `<p class="muted" style="margin:.4rem 0 .8rem">Valid through ${fmtDay(new Date(Date.parse(p.expires_at) - 1))}</p><button class="btn redeem">Redeem now</button>` : ""}
      ${p.status === "not_yet" ? `<p class="muted" style="margin:.4rem 0 0">Won today. Can be redeemed from ${fmtDay(p.valid_from)}.</p>` : ""}
      ${p.status === "redeemed" ? `<p style="margin:.4rem 0 0;color:#ff8a8e;font-weight:700">Redeemed ${fmt(p.redeemed_at)} at ${esc(p.redeemed_venue || "")}${p.redeemed_by ? ` by ${esc(p.redeemed_by)}` : ""}</p>` : ""}
      ${p.status === "expired" ? `<p class="muted" style="margin:.4rem 0 0">Expired ${fmtDay(p.expires_at)}.</p>` : ""}
      ${p.status === "voided" ? `<p class="muted" style="margin:.4rem 0 0">Voided by admin.</p>` : ""}
    </div>`).join("");
    $$("#results .redeem").forEach((b) => (b.onclick = async () => {
      const card = b.closest(".prize"), id = card.dataset.id;
      if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Tap again to confirm"; setTimeout(() => { delete b.dataset.armed; b.textContent = "Redeem now"; }, 4000); return; }
      b.disabled = true;
      try { const res = await api.redeemPrize(id, venue.id); if (!res.ok) { card.insertAdjacentHTML("beforeend", `<div class="error" style="margin-top:.6rem">${esc(res.error)}</div>`); return; }
        card.outerHTML = `<div class="done"><div class="big">REDEEMED</div><div>${esc(card.querySelector(".big").textContent)} for ${esc(card.querySelector(".who").textContent)}</div><p class="muted" style="margin:.5rem 0 0">${esc(venue.name)}, ${fmt(new Date())}. Apply the LCTG Prize comp in Toast.</p></div>`;
        $("#phone").value = "";
      } catch (e) { card.insertAdjacentHTML("beforeend", `<div class="error" style="margin-top:.6rem">${esc(e.message)}</div>`); b.disabled = false; }
    }));
  }

  try { me = await api.me(); } catch {}
  if (me) await boot(); else show("viewLogin");
})();
</script>
</body>
</html>
