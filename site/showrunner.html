<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Call Tavern Games - Showrunner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=__BUILD__">
<style>
  body { min-height: 100vh; }
  #console { max-width: 1000px; margin: 0 auto; padding: 2rem 1.25rem; }
  .topbar { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
  .topbar .brand { font-family: var(--display); font-size: 1.6rem; letter-spacing: .04em; } .topbar .brand span { color: var(--accent); }
  .login-box { max-width: 420px; margin: 10vh auto 0; }

  /* ---- TV stage ---- */
  #stage { position: fixed; inset: 0; background: var(--primary); color: #fff; display: none; overflow: hidden;
           background-image: radial-gradient(1200px 600px at 50% -10%, rgba(255,255,255,.18), transparent 60%); transition: background .6s; }
  #stage.on { display: flex; flex-direction: column; }
  #stage.dark { background: #070304; background-image: radial-gradient(900px 500px at 50% 110%, rgba(170,0,0,.35), transparent 60%), radial-gradient(700px 400px at 50% -10%, rgba(120,0,0,.25), transparent 60%); }
  .stage-head { display: flex; align-items: center; justify-content: space-between; padding: 2.2vh 3vw; }
  .stage-head .venue { display: flex; align-items: center; gap: 1.2vw; }
  .stage-head .venue img { height: 9vh; max-width: 30vw; object-fit: contain; }
  .stage-head .venue .name { font-family: var(--display); font-size: 6vh; line-height: 1; }
  .stage-head .venue .tag { font-size: 2.2vh; opacity: .8; }
  .stage-head .prize { text-align: right; font-size: 2.6vh; }
  .stage-head .lctg { font-family: var(--display); font-size: 3.2vh; letter-spacing: .12em; opacity: .75; } .stage-head .lctg span { color: var(--accent); }
  .stage-head .prize b { display: block; font-family: var(--display); font-size: 4.5vh; color: var(--accent); }
  .stage-body { flex: 1; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 0 3vw; position: relative; }
  .stage-foot { padding: 1.2vh 3vw; display: flex; justify-content: space-between; align-items: center; font-size: 2.4vh; opacity: .9; }
  .stage-foot .hint { flex: 1; }

  /* key bar */
  .keys { display: flex; gap: 2.2vw; align-items: center; justify-content: flex-end; }
  .keys span { display: inline-flex; align-items: center; gap: .8vh; font-size: 2vh; opacity: .55; letter-spacing: .02em; }
  .keys b { display: inline-flex; align-items: center; justify-content: center; min-width: 4.2vh; height: 4.2vh; padding: 0 1vh; border: 2px solid rgba(255,255,255,.7); border-bottom-width: .6vh; border-radius: .9vh; font-family: var(--display); font-size: 2.6vh; letter-spacing: .05em; }
  .gamesel { display: inline-flex; align-items: center; gap: 1.2vh; font-family: var(--display); font-size: 3.2vh; letter-spacing: .06em; background: rgba(255,255,255,.08); padding: .5vh 1.8vh; border-radius: 1.5vh; margin-bottom: 1.2vh; }
  .gamesel .arrows { font-size: 2.2vh; opacity: .55; font-family: var(--font); letter-spacing: 0; }
  .timer.idle .fg { stroke-dashoffset: 0; stroke: rgba(255,255,255,.25); } .timer.idle .num { font-size: 3.4vh; opacity: .8; }

  /* sign-up (wanna play a game?) */
  .signup { display: grid; grid-template-columns: 1fr 1fr; gap: 4vw; align-items: center; width: 100%; max-width: 92vw; }
  .qr-wrap { background: #fff; padding: 2.2vh; border-radius: 3vh; width: min(52vh, 36vw); aspect-ratio: 1; display: flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: 0 0 0 1vh #1a0a0a, 0 30px 60px rgba(0,0,0,.6); }
  .qr-wrap svg { width: 100%; height: 100%; }
  .signup .cta h1 { font-family: "Special Elite", "Courier New", monospace; font-size: 7.2vh; line-height: 1; margin-bottom: 1.5vh; color: #f2e9e4; text-shadow: 0 0 2vh rgba(255,0,0,.35); animation: flicker 6s infinite; }
  .signup .cta h1 span { color: #e01e26; }
  .signup .cta p { font-size: 2.6vh; opacity: .9; margin: 0 0 1.6vh; font-family: "Special Elite", monospace; }
  .signup .code { font-family: var(--display); font-size: 4.4vh; letter-spacing: .15em; background: rgba(255,255,255,.08); display: inline-block; padding: .5vh 2vh; border-radius: 1.5vh; }
  .picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(14vw, 1fr)); gap: 1vh; margin-top: 1.8vh; }
  .pick { display: flex; align-items: center; gap: 1vh; background: rgba(255,255,255,.06); border-radius: 1.6vh; padding: .8vh 1.4vh; font-size: 2.3vh; white-space: nowrap; }
  .pick .e { height: 5.5vh; display: flex; align-items: flex-end; } .pick .e svg, .pick .e img { height: 100%; width: auto; }
  .pick .n { margin-left: auto; font-family: var(--display); font-size: 3.6vh; color: var(--accent); min-width: 2ch; text-align: right; }
  .timer { position: relative; width: 17vh; height: 17vh; margin: 0 auto 1vh; }
  .timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .timer circle { fill: none; stroke-width: 1.6vh; }
  .timer .bg { stroke: rgba(255,255,255,.12); } .timer .fg { stroke: #e01e26; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .timer .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: "Special Elite", monospace; font-size: 6vh; color: #fff; }
  .timer.urgent .fg { stroke: #ff4b4b; } .timer.urgent .num { color: #ff4b4b; animation: pulse 1s infinite; }
  .count { font-size: 2.6vh; opacity: .9; } .count b { font-family: var(--display); font-size: 5vh; color: var(--accent); vertical-align: -.1em; }
  @keyframes flicker { 0%, 97%, 100% { opacity: 1; } 97.5% { opacity: .55; } 98% { opacity: 1; } 98.6% { opacity: .4; } 99% { opacity: 1; } }
  @keyframes pulse { 50% { transform: scale(1.08); } }

  /* results */
  .results { text-align: center; }
  .results .big { height: 34vh; display: flex; justify-content: center; filter: drop-shadow(0 20px 30px rgba(0,0,0,.5)); animation: pop .6s cubic-bezier(.2,1.4,.4,1) both; } .results .big svg { height: 100%; width: auto; }
  .results h1 { font-size: 11vh; line-height: 1; margin: 1vh 0; } .results h1 span { color: var(--accent); }
  .results p { font-size: 3.4vh; opacity: .95; margin: 1vh 0; }
  .results .names { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.2vh; margin-top: 2.5vh; max-width: 90vw; }
  .results .names span { background: rgba(0,0,0,.3); padding: 1vh 2vh; border-radius: 999px; font-size: 2.8vh; }
  @keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .confetti { position: absolute; inset: 0; pointer-events: none; }

  /* leaderboard */
  .board { display: grid; grid-template-columns: 1fr 1fr; gap: 3vw; width: 100%; max-width: 92vw; }
  .board h2 { font-size: 5vh; margin-bottom: 1vh; } .board h2 span { color: var(--accent); }
  .board table { width: 100%; border-collapse: collapse; font-size: 2.9vh; }
  .board td { padding: .7vh 1vh; border-bottom: 1px solid rgba(255,255,255,.15); } .board tr:first-child td { background: rgba(255,205,0,.12); }
  .board td.r { font-family: var(--display); font-size: 3.6vh; color: var(--accent); width: 6vh; } .board td.p { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; } .board td.w { text-align: right; opacity: .6; width: 10vh; }
  .board .empty { opacity: .7; font-size: 2.8vh; padding: 2vh 0; }

  /* settings panel (S) */
  #settings { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 90vw); background: var(--panel); border-left: 1px solid var(--line); padding: 1.5rem; transform: translateX(100%); transition: transform .2s; z-index: 60; overflow: auto; }
  #settings.on { transform: none; }
  #settings h2 { margin-bottom: 1rem; }
  .fieldlist{display:flex;flex-wrap:wrap;gap:1vh 1.6vh;margin-top:2vh;max-height:22vh;overflow:hidden}
  .fieldlist .fm{display:inline-flex;align-items:center;gap:.8vh;font-size:2.4vh;font-weight:700;background:rgba(255,255,255,.08);border-radius:3vh;padding:.5vh 1.4vh .5vh .6vh}
  .mdot{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:900;font-size:1.5vh;text-shadow:0 1px 2px #0008;box-shadow:0 .2vh .6vh #0005}
</style>
</head>
<body>

<div id="console">
  <div class="topbar"><div class="brand">LAST CALL <span>TAVERN GAMES</span></div><div class="grow"></div><a href="index.html" class="btn small">Portal</a></div>
  <section id="viewLogin" class="card login-box stack">
    <h1>Showrunner login</h1>
    <div id="loginError" class="error hidden"></div>
    <div><label>Username or email</label><input id="username" autocomplete="username" autocapitalize="none"></div>
    <div><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
    <button id="btnLogin" class="btn primary big" style="width:100%">Log in</button>
    <p id="mockNote" class="muted hidden" style="font-size:.85rem">Preview mode (no database). Try <b>dj</b> / <b>dj</b>.</p>
  </section>
  <section id="viewVenue" class="card login-box stack hidden">
    <h1>Which bar are you at?</h1>
    <select id="venueSelect"></select>
    <div><label>Tonight's prize</label><input id="prize" placeholder="e.g. a free round, $10 gift card, a shot"></div>
    <button id="btnVenue" class="btn primary big" style="width:100%">Go to the TV screen</button>
    <p class="muted" style="font-size:.85rem">From here on everything is TV-safe. The key bar at the bottom of the screen shows what each key does.</p>
  </section>
</div>

<!-- TV STAGE -->
<div id="stage">
  <div class="stage-head">
    <div class="venue"><img id="stLogo" alt="" class="hidden"><div><div class="name" id="stVenue"></div><div class="tag" id="stTag"></div></div></div>
    <div class="lctg">LAST CALL <span>TAVERN GAMES</span></div>
    <div class="prize">Tonight's prize<b id="stPrize"></b></div>
  </div>
  <div class="stage-body" id="stageBody"></div>
  <div class="stage-foot"><div id="stFootLeft"></div><div class="hint" id="stHint"></div></div>
</div>

<!-- SETTINGS (S) -->
<div id="settings" class="stack">
  <h2>Settings</h2>
  <div><label>Bar</label><select id="sVenue"></select></div>
  <div><label>Tonight's prize</label><input id="sPrize"></div>
  <div><label>Sign-up countdown (seconds)</label><input id="sCountdown" type="number" min="20" max="600" step="5"></div>
  <div><label>Game</label><select id="sGame"></select></div>
  <div id="sRacersRow"><label>Racers (pick 4)</label><div id="sRacers" class="stack" style="gap:.4rem"></div></div>
  <div><label>Lobby music</label><select id="sMusic"></select></div>
  <div id="sThemeRow"><label>Track theme</label><select id="sTheme"></select></div>
  <div id="sGraphicsRow"><label>Graphics</label><select id="sGraphics"><option value="auto">Auto (recommended)</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div>
  <div class="row"><button id="sMute" class="btn small">Mute</button><button id="sFull" class="btn small">Fullscreen</button></div>
  <div class="row"><a href="index.html" class="btn small">Portal</a><button id="sLogout" class="btn small">Log out</button></div>
  <button id="sClose" class="btn primary" style="width:100%">Close (S)</button>
</div>

<script src="config.js?v=__BUILD__"></script>
<script src="vendor/supabase.js?v=__BUILD__"></script>
<script src="vendor/qrcode.js?v=__BUILD__"></script>
<script src="mascots.js?v=__BUILD__"></script>
<script src="sprites.js?v=__BUILD__"></script>
<script src="race.js?v=__BUILD__"></script>
<script src="audio.js?v=__BUILD__"></script>
<script src="common.js?v=__BUILD__"></script>
<script>
(async function () {
  const { api, MOCK, $, $$, esc, sleep, decorateOptions } = window.BG;
  const art = (o, h) => o.icon_url ? `<img src="${esc(o.icon_url)}" alt="" style="height:${h}px">` : o.image_url ? `<img src="${esc(o.image_url)}" alt="" style="height:${h}px">` : MASCOTS.standalone(o.id, h, { emoji: o.emoji });
  const state = { me: null, venue: null, venues: [], games: [], game: null, round: null, phase: "console", poll: null, raceCtl: null, timer: null, auto: null, season: null,
                  settings: { prize: "", countdown: 120, gameKey: "race", racers: null, theme: "classic" } };
  try { Object.assign(state.settings, JSON.parse(localStorage.getItem("lctg.settings") || "{}")); } catch {}
  const saveSettings = () => { try { localStorage.setItem("lctg.settings", JSON.stringify(state.settings)); } catch {} };

  const show = (id) => ["viewLogin", "viewVenue"].forEach((v) => $("#" + v).classList.toggle("hidden", v !== id));
  const toast = (msg) => { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3500); };
  const firstLast = (n) => { const p = String(n).trim().split(/\s+/); return p.length > 1 ? `${p[0]} ${p[p.length - 1][0]}.` : p[0]; };
  const toggleFullscreen = () => { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch {} };
  const clearTimers = () => { clearInterval(state.poll); state.poll = null; clearInterval(state.timer); state.timer = null; clearTimeout(state.auto); state.auto = null; if (state.raceCtl) { state.raceCtl.stop(); state.raceCtl = null; } };
  if (MOCK) $("#mockNote").classList.remove("hidden");

  // ---------- login + venue ----------
  async function doLogin() {
    const err = $("#loginError"); err.classList.add("hidden"); $("#btnLogin").disabled = true;
    try { state.me = await api.signIn($("#username").value, $("#password").value); await afterLogin(); }
    catch (e) { err.textContent = e.message || "Login failed."; err.classList.remove("hidden"); } finally { $("#btnLogin").disabled = false; }
  }
  $("#btnLogin").onclick = doLogin; $("#password").addEventListener("keydown", (e) => e.key === "Enter" && doLogin()); $("#username").addEventListener("keydown", (e) => e.key === "Enter" && $("#password").focus());
  async function afterLogin() {
    state.venues = await api.listVenues();
    state.games = (await api.listGames()).map((g) => ({ ...g, options: decorateOptions(g.options) }));
    try { state.season = await api.currentSeason(); } catch {}
    for (const id of ["venueSelect", "sVenue"]) $("#" + id).innerHTML = state.venues.map((v) => `<option value="${v.id}">${esc(v.name)}</option>`).join("");
    $("#sGame").innerHTML = state.games.map((g) => `<option value="${esc(g.key)}">${esc(g.name)}</option>`).join("");
    let last = null; try { last = localStorage.getItem("bg.venue"); } catch {}
    if (last && state.venues.some((v) => v.id === last)) { $("#venueSelect").value = last; $("#prize").value = state.settings.prize || state.venues.find((v) => v.id === last).default_prize || ""; }
    $("#venueSelect").onchange = () => { $("#prize").value = state.venues.find((v) => v.id === $("#venueSelect").value).default_prize || ""; };
    show("viewVenue");
  }
  function setVenue(id) {
    state.venue = state.venues.find((v) => v.id === id); try { localStorage.setItem("bg.venue", id); } catch {}
    const v = state.venue; stage.style.setProperty("--primary", v.color_primary || "#004c54"); stage.style.setProperty("--accent", v.color_accent || "#ffcd00");
    $("#stVenue").textContent = v.name; $("#stTag").textContent = v.tagline || "";
    const img = $("#stLogo"); if (v.logo_url) { img.src = v.logo_url; img.classList.remove("hidden"); } else img.classList.add("hidden");
    $("#sVenue").value = id;
  }
  $("#btnVenue").onclick = () => {
    state.settings.prize = $("#prize").value.trim(); saveSettings();
    setVenue($("#venueSelect").value); try { AUDIO.unlock(); } catch {}
    $("#console").classList.add("hidden"); stage.classList.add("on");
    if (!document.fullscreenElement) { try { document.documentElement.requestFullscreen().catch(() => {}); } catch {} }
    renderLanding({ fresh: true });
  };

  // ---------- settings panel ----------
  const settings = $("#settings");
  function openSettings() { $("#sPrize").value = state.settings.prize; $("#sCountdown").value = state.settings.countdown; $("#sGame").value = state.settings.gameKey; renderRacerPicker(); $("#sGame").onchange = renderRacerPicker;
    $("#sTheme").innerHTML = Object.entries(RACE.THEMES).map(([k, t]) => `<option value="${k}">${esc(t.name)}</option>`).join(""); $("#sTheme").value = state.settings.theme || "classic"; $("#sGraphics").value = state.settings.graphics || "auto";
    const mo = AUDIO.musicOptions(); $("#sMusic").innerHTML = `<option value="random">Random (pick one per night)</option>` + mo.map((k, i) => `<option value="${k}">Track ${i + 1}</option>`).join(""); $("#sMusic").value = AUDIO.musicChoice(); $("#sMute").textContent = AUDIO.isMuted() ? "Unmute" : "Mute"; settings.classList.add("on"); $("#sPrize").focus(); }
  async function closeSettings() {
    const picked = $$("#sRacers input:checked").map((cb) => cb.value);
    if ($("#sGame").value !== "barmarbles" && picked.length !== Math.min(ROSTER_SIZE, $$("#sRacers input").length)) { toast(`Pick exactly ${ROSTER_SIZE} racers.`); return; }
    const rosterChanged = $("#sGame").value !== "barmarbles" && JSON.stringify(picked) !== JSON.stringify(roster(state.games.find((x) => x.key === $("#sGame").value) || state.game) || []);
    const venueChanged = $("#sVenue").value !== state.venue.id, gameChanged = $("#sGame").value !== state.settings.gameKey, prizeChanged = $("#sPrize").value.trim() !== state.settings.prize;
    state.settings.racers = picked; state.settings.theme = $("#sTheme").value; state.settings.graphics = $("#sGraphics").value; if ($("#sMusic").value !== AUDIO.musicChoice()) AUDIO.setMusicChoice($("#sMusic").value);
    state.settings.prize = $("#sPrize").value.trim(); state.settings.countdown = Math.max(20, Math.min(600, +$("#sCountdown").value || 120)); state.settings.gameKey = $("#sGame").value; saveSettings();
    if (venueChanged) setVenue($("#sVenue").value);
    $("#stPrize").textContent = prizeText(); settings.classList.remove("on");
    if ((venueChanged || gameChanged || prizeChanged || rosterChanged) && state.phase === "landing") { try { await api.setRoundStatus(state.round.id, "cancelled"); } catch {} renderLanding({ fresh: true }); }
  }
  $("#sClose").onclick = closeSettings; $("#sMute").onclick = () => { AUDIO.setMuted(!AUDIO.isMuted()); $("#sMute").textContent = AUDIO.isMuted() ? "Unmute" : "Mute"; }; $("#sFull").onclick = toggleFullscreen; $("#sLogout").onclick = async () => { await api.signOut(); location.reload(); };

  // ---------- stage screens ----------
  const stage = $("#stage");
  const ROSTER_SIZE = 4;
  function roster(game) {   // the ids in play for this game, always exactly ROSTER_SIZE when the game has that many
    if (game.key === "barmarbles") return null; // every colour is always in play
    const ids = (game.options || []).map((o) => o.id);
    const chosen = (state.settings.racers || []).filter((id) => ids.includes(id));
    return chosen.length === Math.min(ROSTER_SIZE, ids.length) ? chosen : ids.slice(0, ROSTER_SIZE);
  }
  const activeOptions = (game) => { const r = roster(game); return r ? game.options.filter((o) => r.includes(o.id)) : game.options; };
  const isMarbles = () => state.game && state.game.key === "barmarbles";
  const hexOf = (pick) => { const o = (state.game.options || []).find((x) => x.id === pick); return (o && o.hex) || "#ffffff"; };
  const tagOf = (n) => { const w = String(n || "").trim().split(/\s+/); return ((w[0] || "")[0] || "").toUpperCase() + ((w.length > 1 ? w[w.length - 1][0] : (w[0] || "")[1]) || "").toUpperCase(); };
  const marbleDot = (hex, tag, px) => `<span class="mdot" style="width:${px};height:${px};background:radial-gradient(circle at 35% 30%, #fff8 0, ${esc(hex)} 45%, #0005 100%)">${esc(tag || "")}</span>`;
  function renderRacerPicker() {
    const g = state.games.find((x) => x.key === $("#sGame").value) || state.game || state.games[0]; if (!g) return;
    const marbles = g.key === "barmarbles"; $("#sRacersRow").style.display = marbles ? "none" : ""; $("#sThemeRow").style.display = marbles ? "none" : ""; $("#sGraphicsRow").style.display = marbles ? "" : "none";
    const cur = roster(g) || [];
    $("#sRacers").innerHTML = g.options.map((o) => `<label style="display:flex;align-items:center;gap:.6rem;margin:0;color:var(--text)"><input type="checkbox" value="${esc(o.id)}" ${cur.includes(o.id) ? "checked" : ""}> ${art(o, 34)} ${esc(o.label)}</label>`).join("");
    $$("#sRacers input").forEach((cb) => (cb.onchange = () => { const on = $$("#sRacers input:checked"); if (on.length > ROSTER_SIZE) { cb.checked = false; toast(`Pick ${ROSTER_SIZE} racers.`); } }));
  }
  const prizeText = () => state.settings.prize || state.venue.default_prize || "";
  function qrSvg(text) { const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); }

  const KEYS = { landing: [["ENTER", "Start the clock"], ["↑↓", "Game"], ["T", "Demo race"], ["S", "Settings"], ["M", "Mute"], ["ESC", "Menu"]], signup: [["ENTER", "Race now"], ["ESC", "Stop clock"], ["M", "Mute"]], results: [["ENTER", "Leaderboard"]], board: [["ENTER", "Next"]], running: [["ESC", "Abort race"]] };
  const keybar = (phase) => { $("#stHint").innerHTML = `<div class="keys">${(KEYS[phase] || []).filter(([k]) => k !== "T" || isMarbles()).map(([k, l]) => `<span><b>${k}</b>${l}</span>`).join("")}</div>`; };

  // LANDING: "Wanna play a game?" with the QR live; the clock starts on Enter
  async function renderLanding(opts = {}) {
    clearTimers(); state.phase = "landing"; stage.classList.add("dark");
    try { AUDIO.event("end"); } catch {}
    $("#stPrize").textContent = prizeText();
    state.game = state.games.find((x) => x.key === state.settings.gameKey) || state.games[0];
    try { AUDIO.setGame(state.game.key); } catch {}
    if (!state.round || opts.fresh) {
      try { state.round = await api.createRound({ venue_id: state.venue.id, game_key: state.game.key, prize: state.settings.prize, racers: roster(state.game) }); } catch (e) { toast(e.message); return; }
    }
    const g = { ...state.game, options: activeOptions(state.game) }, url = window.BG.entryUrl(state.round.code), secs = state.settings.countdown, C = 2 * Math.PI * 45;
    $("#stageBody").innerHTML = `<div class="signup">
      <div><div class="qr-wrap">${qrSvg(url)}</div></div>
      <div class="cta">
        <div class="gamesel"><span class="arrows">▲▼</span>${esc(g.name.toUpperCase())}</div>
        <h1>WANNA PLAY <span>A GAME?</span></h1>
        <p>${isMarbles() ? `Scan the code. Pick your marble. First to the line wins <b>${esc(prizeText())}</b>.` : `Scan the code. Pick your racer. If it wins, you win <b>${esc(prizeText())}</b>.`}</p>
        <div class="row" style="gap:3vw;align-items:center">
          <div class="timer idle" id="timer"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="45"/><circle class="fg" cx="50" cy="50" r="45" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div class="num" id="timerNum">${secs}s</div></div>
          <div><div class="code">CODE ${esc(state.round.code)}</div><div class="count" style="margin-top:1.5vh"><b id="stCount">0</b> players in</div></div>
        </div>
        ${isMarbles() ? `<div class="fieldlist" id="fieldList"></div>` : `<div class="picks">${g.options.map((o) => `<div class="pick"><span class="e">${art(o, 60)}</span>${esc(o.label)}<span class="n" data-pick="${esc(o.id)}">0</span></div>`).join("")}</div>`}
      </div></div>`;
    $("#stFootLeft").innerHTML = ""; keybar("landing");
    try { AUDIO.event("lobby"); } catch {}
    const tick = async () => { try { const s = await api.roundStats(state.round.id); const c = $("#stCount"); if (c) c.textContent = s.count; $$("[data-pick]").forEach((el) => (el.textContent = s.byPick[el.dataset.pick] || 0));
      if (isMarbles()) { const f = await api.roundField(state.round.id); const el = $("#fieldList"); if (el) el.innerHTML = f.slice(-28).map((e) => `<span class="fm">${marbleDot(hexOf(e.pick), tagOf(e.name), "3.6vh")}${esc(firstLast(e.name))}</span>`).join("") + (f.length > 28 ? `<span class="fm">+${f.length - 28} more</span>` : ""); } } catch {} };
    tick(); state.poll = setInterval(tick, 2500);
  }

  // SIGN-UP: same screen, clock running; race starts at zero
  function startSignup() {
    if (state.phase !== "landing") return;
    state.phase = "signup"; keybar("signup"); try { AUDIO.event("clock"); } catch {}
    const secs = state.settings.countdown, C = 2 * Math.PI * 45, t0 = Date.now();
    $("#timer").classList.remove("idle"); $("#timerNum").textContent = secs;
    $(".signup .cta p").innerHTML = (isMarbles() ? `Scan the code. Pick your marble. First to the line wins <b>${esc(prizeText())}</b>.` : `Scan the code. Pick your racer. If it wins, you win <b>${esc(prizeText())}</b>.`) + `<br>The race starts when the clock runs out.`;
    state.timer = setInterval(() => {
      const left = Math.max(0, secs - Math.round((Date.now() - t0) / 1000));
      const el = $("#timerNum"), fg = $("#timer .fg"); if (!el) return;
      el.textContent = left; fg.style.strokeDashoffset = (C * (1 - left / secs)).toFixed(1);
      if (left <= 10) { $("#timer").classList.add("urgent"); if (left > 0) { try { AUDIO.event("countbeep"); } catch {} } }
      if (left <= 0) { clearInterval(state.timer); state.timer = null; startRace(); }
    }, 250);
  }
  function stopClock() {
    if (state.phase !== "signup") return;
    clearInterval(state.timer); state.timer = null; state.phase = "landing"; keybar("landing");
    const t = $("#timer"); if (t) { t.classList.add("idle"); t.classList.remove("urgent"); $("#timerNum").textContent = state.settings.countdown + "s"; $("#timer .fg").style.strokeDashoffset = 0; }
    const p = $(".signup .cta p"); if (p) p.innerHTML = isMarbles() ? `Scan the code. Pick your marble. First to the line wins <b>${esc(prizeText())}</b>.` : `Scan the code. Pick your racer. If it wins, you win <b>${esc(prizeText())}</b>.`;
  }
  async function abortRace() {
    clearTimers(); try { AUDIO.event("end"); } catch {}
    const r = state.round; state.round = null;
    if (r) { try { await api.setRoundStatus(r.id, "cancelled"); } catch {} }   // cancelled rounds score nothing and issue no prizes
    renderLanding({ fresh: true });
  }
  async function exitToMenu() {
    clearTimers(); try { AUDIO.event("end"); } catch {}
    const r = state.round; state.round = null;
    if (r) { try { await api.setRoundStatus(r.id, "cancelled"); } catch {} }
    state.phase = "console"; stage.classList.remove("on", "dark"); $("#console").classList.remove("hidden"); show("viewVenue");
    if (document.fullscreenElement) { try { document.exitFullscreen(); } catch {} }
  }
  async function cycleGame(dir) {
    if (state.phase !== "landing" || state.games.length < 2) return;
    const i = state.games.findIndex((g) => g.key === state.settings.gameKey);
    state.settings.gameKey = state.games[(i + dir + state.games.length) % state.games.length].key; saveSettings();
    try { await api.setRoundStatus(state.round.id, "cancelled"); } catch {}
    renderLanding({ fresh: true });
  }

  async function startRace() {
    if (state.phase !== "signup" && state.phase !== "landing") return;
    state.phase = "running"; clearTimers(); stage.classList.remove("dark"); keybar("running");
    try { await api.setRoundStatus(state.round.id, "running"); } catch (e) { toast(e.message); }
    if (isMarbles()) return startMarbles();
    const opts = activeOptions(state.game), winner = opts[Math.floor(Math.random() * opts.length)];
    $("#stFootLeft").innerHTML = "";
    $("#stageBody").innerHTML = `<div id="raceHost" style="position:absolute;inset:0"></div>`;
    state.raceCtl = RACE.run($("#raceHost"), { racers: opts, winnerId: winner.id, venue: state.venue, theme: state.settings.theme,
      onDone: async () => { try { await api.finishRound(state.round.id, winner.id); } catch (e) { toast(e.message); } renderResults(winner); } });
  }

  // Bar Marbles: every entry is a marble. The engine runs the race and shows its own results screen; we record the places.
  const DEMO_NAMES = ["Marcus Lee", "Dana Ortiz", "Sam Patel", "Kelly Nguyen", "Jordan Fox", "Alex Kim", "Taylor Reed", "Chris Bell", "Morgan Diaz", "Riley Shaw", "Jamie Cole", "Casey Park", "Drew Hart", "Avery Lane", "Quinn Moss", "Reese Ward", "Skyler Dean", "Parker Lowe", "Rowan Gray", "Blake Hale"];
  // T on the landing screen: a demo race with 24 made-up marbles (plus anyone really signed up). Nothing is recorded.
  async function demoMarbles() {
    if (state.phase !== "landing" || !isMarbles()) return;
    state.phase = "running"; clearTimers(); stage.classList.remove("dark"); keybar("running");
    let field = []; try { field = await api.roundField(state.round.id); } catch {}
    const bots = DEMO_NAMES.slice(0, 24).map((n, i) => ({ id: "demo" + i, name: n, pick: (state.game.options[i % state.game.options.length] || {}).id }));
    startMarbles([...field, ...bots], { demo: true });
  }
  async function startMarbles(fieldIn, { demo = false } = {}) {
    let field = fieldIn; if (!field) { try { field = await api.roundField(state.round.id); } catch (e) { toast(e.message); field = []; } }
    if (field.length < 2) { toast("Need at least 2 marbles in. Back to sign-up."); state.phase = "landing"; try { await api.setRoundStatus(state.round.id, "open"); } catch {} renderLanding(); return; }
    const players = field.map((e) => ({ id: e.id, name: e.name, color: hexOf(e.pick), tag: tagOf(e.name) }));
    $("#stFootLeft").innerHTML = ""; $("#stageBody").innerHTML = `<div id="raceHost" style="position:absolute;inset:0"></div>`;
    const mod = await import("./barmarbles.js?v=__BUILD__");
    state.raceCtl = await mod.run($("#raceHost"), { players, venue: state.venue, course: "classic", placesToShow: 5, quality: state.settings.graphics || "auto",
      onDone: async (results) => {
        if (!demo) { try { await api.finishRoundPlaces(state.round.id, results.slice(0, 10).map((p) => p.id)); } catch (e) { toast(e.message); } }
        state.phase = "results"; keybar("results"); try { AUDIO.event("results"); } catch {}
        $("#stFootLeft").innerHTML = demo ? `<span class="count">Demo race. Nothing recorded, no prize.</span>` : `<span class="count"><b>${players.length}</b> raced. Winner's prize: ${esc(prizeText())}, valid from tomorrow for 14 days at any LCTG bar.</span>`;
        state.auto = setTimeout(renderBoard, 16000);
      } });
  }

  async function renderResults(winner) {
    state.phase = "results"; try { AUDIO.event("results"); } catch {}
    let s = { winners: [], count: 0 }; try { s = await api.roundStats(state.round.id); } catch {}
    const names = s.winners.map(firstLast);
    $("#stageBody").innerHTML = `<div class="results">
        <div class="big"><svg viewBox="0 0 200 260" style="height:100%;overflow:visible" id="winArt"></svg></div>
        <h1><span>${esc(winner.label.toUpperCase())}</span> WINS!</h1>
        <p>${names.length ? `${names.length} winner${names.length === 1 ? "" : "s"} picked ${esc(winner.label)}. Watch your phone for your prize. Valid from tomorrow for 14 days at any LCTG bar.` : `Nobody picked ${esc(winner.label)} this time. Better luck next round!`}</p>
        <div class="names">${names.slice(0, 40).map((x) => `<span>${esc(x)}</span>`).join("")}${names.length > 40 ? `<span>+${names.length - 40} more</span>` : ""}</div>
      </div><canvas class="confetti" id="confetti"></canvas>`;
    $("#stFootLeft").innerHTML = `<span class="count"><b>${s.count}</b> played</span>`; keybar("results");
    (async () => {
      let a; if (winner.sprite_url) { try { a = await SPRITES.actor(winner.sprite_url, winner.extra_url, { scale: winner.sprite_scale, fix: winner.sprite_fix }); } catch {} }
      if (!a) { const g = document.createElementNS("http://www.w3.org/2000/svg", "g"); g.innerHTML = winner.image_url ? `<image href="${esc(winner.image_url)}" width="200" height="240" preserveAspectRatio="xMidYMax meet"/>` : MASCOTS.markup(winner.id, { emoji: winner.emoji }); a = winner.image_url ? { el: g, set() {}, tick() {} } : SPRITES.vectorActor(g.querySelector(".mascot")); }
      const host = $("#winArt"); if (!host) return; host.innerHTML = MASCOTS.DEFS; host.appendChild(a.el); a.set("win"); let lastT = performance.now();
      const tick = (now) => { if (state.phase !== "results") return; a.tick((now - lastT) / 1000, 1); lastT = now; requestAnimationFrame(tick); }; requestAnimationFrame(tick);
    })();
    confetti($("#confetti"));
    state.auto = setTimeout(renderBoard, 14000);
  }

  async function renderBoard() {
    if (state.phase !== "results") return;
    clearTimers(); state.phase = "board"; try { AUDIO.event("board"); } catch {}
    let night = [], season = []; try { [night, season] = await Promise.all([api.leaderboard(state.venue.id, "night", 10), api.leaderboard(state.venue.id, "season", 10)]); } catch (e) { toast(e.message); }
    const table = (rows, empty) => rows.length ? `<table>${rows.map((t) => `<tr><td class="r">${t.rank}</td><td>${esc(t.display_name)}</td><td class="w">${t.wins ? t.wins + "W" : ""}</td><td class="p">${t.points}</td></tr>`).join("")}</table>` : `<div class="empty">${empty}</div>`;
    $("#stageBody").innerHTML = `<div class="board">
      <div><h2>TONIGHT AT <span>${esc(state.venue.name.toUpperCase())}</span></h2>${table(night, "Be the first on tonight's board.")}</div>
      <div><h2><span>${esc((state.season?.name || "SEASON").toUpperCase())}</span> STANDINGS</h2>${table(season, "Season standings start with the first race.")}</div></div>`;
    $("#stFootLeft").innerHTML = `<span style="opacity:.7;font-size:2.2vh">1 point per play, 10 for backing the winner</span>`; keybar("board");
    state.round = null; state.auto = setTimeout(() => renderLanding({ fresh: true }), 15000);
  }

  function confetti(canvas) {
    const ctx = canvas.getContext("2d"); canvas.width = innerWidth; canvas.height = innerHeight;
    const accent = getComputedStyle(stage).getPropertyValue("--accent").trim() || "#ffcd00";
    const cols = [accent, "#fff", "#ff5c5c", "#5cc8ff", "#7ee2a8"];
    const ps = Array.from({ length: 220 }, () => ({ x: Math.random() * canvas.width, y: -Math.random() * canvas.height, w: 6 + Math.random() * 8, h: 10 + Math.random() * 10, c: cols[Math.floor(Math.random() * cols.length)], vy: 2 + Math.random() * 4, vx: -1 + Math.random() * 2, a: Math.random() * 6, va: -0.1 + Math.random() * 0.2 }));
    const t0 = performance.now();
    (function f(now) { if (state.phase !== "results" || now - t0 > 9000) return; ctx.clearRect(0, 0, canvas.width, canvas.height);
      ps.forEach((p) => { p.y += p.vy; p.x += p.vx; p.a += p.va; if (p.y > canvas.height) { p.y = -20; p.x = Math.random() * canvas.width; } ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); });
      requestAnimationFrame(f); })(t0);
  }

  // ---------- keys: Enter advances, Esc returns to ready, S settings ----------
  async function advance() {
    try { AUDIO.unlock(); } catch {}
    if (state.phase === "landing") startSignup();
    else if (state.phase === "signup") startRace();
    else if (state.phase === "results") renderBoard();
    else if (state.phase === "board") renderLanding({ fresh: true });
  }
  document.addEventListener("keydown", async (e) => {
    const typing = ["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement?.tagName);
    if (settings.classList.contains("on")) { if (e.key === "Escape" || (e.key.toLowerCase() === "s" && !typing)) { e.preventDefault(); closeSettings(); } return; }
    if (typing || state.phase === "console") return;
    if (e.key.toLowerCase() === "f") { toggleFullscreen(); return; }
    if (e.key.toLowerCase() === "s") { e.preventDefault(); openSettings(); return; }
    if (e.key.toLowerCase() === "t") { e.preventDefault(); demoMarbles(); return; }
    if (e.key.toLowerCase() === "d" && state.raceCtl && state.raceCtl.toggleStats) { state.raceCtl.toggleStats(); return; }
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); advance(); }
    if (e.key === "ArrowUp" || e.key === "ArrowDown") { e.preventDefault(); cycleGame(e.key === "ArrowUp" ? -1 : 1); }
    if (e.key === "Escape") {
      if (state.phase === "signup") stopClock();                       // clock running: stop it, keep the sign-ups
      else if (state.phase === "running") abortRace();                  // mid-race: throw the race out, nothing saved
      else if (state.phase === "results" || state.phase === "board") renderLanding({ fresh: true });
      else if (state.phase === "landing") exitToMenu();                 // lobby: back to the bar/prize screen
    }
  });
  stage.addEventListener("click", () => { if (!settings.classList.contains("on") && state.phase !== "running") advance(); });

  try { state.me = await api.me(); } catch {}
  if (state.me) await afterLogin(); else show("viewLogin");
})();
</script>
</body>
</html>
