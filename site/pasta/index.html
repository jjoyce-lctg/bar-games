<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Blue Bayou Pasta To-Go</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amarante&family=Alef:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0c3f7a;--blue:#3f77a8;--sky:#8dd7f7;--yellow:#eeee22;--bg:#1f2327;--panel:#2b3036;--text:#f4f6f8;--muted:#b9c2cc;}
body{margin:0;background:var(--bg);font-family:Alef,Arial,sans-serif;color:var(--text);}
.wrap{max-width:460px;margin:0 auto;padding:20px 18px 48px;}
.logo{display:block;width:170px;margin:4px auto 14px;}
h1{font-family:Amarante,Georgia,serif;font-size:30px;margin:0 0 6px;text-align:center;color:var(--sky);letter-spacing:.5px;font-weight:normal;}
.sub{margin:0 0 18px;color:var(--muted);font-size:15px;text-align:center;line-height:1.45;}
.sub b{color:var(--yellow);font-weight:normal;font-family:Amarante,Georgia,serif;font-size:19px;}
label{display:block;font-size:13px;font-weight:bold;margin:14px 0 6px;color:var(--sky);text-transform:uppercase;letter-spacing:.6px;}
input,select{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border:1px solid #4a5563;border-radius:8px;background:var(--panel);color:var(--text);font-family:inherit;}
input:focus,select:focus{outline:2px solid var(--sky);border-color:var(--sky);}
select:disabled{opacity:.6;}
button{width:100%;margin-top:22px;padding:14px;font-size:18px;border:0;border-radius:8px;background:var(--yellow);color:var(--navy);font-family:Amarante,Georgia,serif;letter-spacing:.5px;cursor:pointer;}
button:disabled{background:#6f7680;color:#2b3036;cursor:default;}
.note{font-size:13px;color:var(--muted);margin-top:6px;}
.msg{margin-top:18px;padding:14px;border-radius:8px;font-size:16px;display:none;line-height:1.45;}
.ok{background:#153a5e;color:#fff;border:1px solid var(--sky);display:block;}
.err{background:#4a1f1f;color:#ffd9d9;border:1px solid #b24a4a;display:block;}
.loading{padding:40px 0;text-align:center;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="logo.png" alt="Blue Bayou Bar & Grill">
  <h1>Pasta Night To-Go</h1>
  <p class="sub" style="margin-bottom:8px"><b>Pasta, sauce, garlic bread, and salad included.</b></p>
  <p class="sub">Family-style pasta, to-go! Available Thursdays. Limited order availability. Orders close at noon on pickup day. Pay when you pick up.</p>
  <div id="loading" class="loading">Loading available dates...</div>
  <form id="f" style="display:none">
    <label for="date">Pickup Thursday</label>
    <select id="date" required></select>
    <div class="note" id="dnote"></div>
    <label for="window">Pickup window</label>
    <select id="window" required></select>
    <label for="qty">How many family-style pastas?</label>
    <select id="qty" required></select>
    <label for="sauce">Sauce</label>
    <select id="sauce" required></select>
    <label for="name">Name</label>
    <input id="name" required autocomplete="name">
    <label for="phone">Phone</label>
    <input id="phone" type="tel" required autocomplete="tel">
    <label for="email">Email</label>
    <input id="email" type="email" required autocomplete="email">
    <button id="btn" type="submit">Place order</button>
  </form>
  <div id="msg" class="msg"></div>
</div>
<script>
var API = "https://script.google.com/macros/s/AKfycbz14qjruajw4Xg337GIkX4XE-CSQu4anCLCco_kBRO0k3UoE59OIXyVBSNaf89jDRE/exec";

function el(id){ return document.getElementById(id); }
function opt(sel, val, text, dis){ var o = document.createElement("option"); o.value = val; o.textContent = text; if (dis) o.disabled = true; sel.appendChild(o); }
function show(cls, text){ var m = el("msg"); m.className = "msg " + cls; m.textContent = text; }

function fill(a){
  var ds = el("date"); ds.innerHTML = ""; var anyOpen = false;
  a.dates.forEach(function(d){
    var t = d.label;
    if (d.status === "full") t += " (sold out)";
    else if (d.status === "closed") t += " (ordering closed)";
    else { anyOpen = true; }
    opt(ds, d.key, t, d.status !== "open");
  });
  var ws = el("window"); ws.innerHTML = ""; a.windows.forEach(function(w){ opt(ws, w, w); });
  var qs = el("qty"); qs.innerHTML = ""; for (var i = 1; i <= a.maxQty; i++) opt(qs, i, i);
  var ss = el("sauce"); ss.innerHTML = ""; a.sauces.forEach(function(s){ opt(ss, s, s); });
  var first = a.dates.filter(function(d){ return d.status === "open"; })[0];
  if (first) ds.value = first.key;
  el("loading").style.display = "none"; el("f").style.display = "block";
  el("dnote").textContent = ""; el("btn").disabled = false;
  if (!anyOpen) { el("dnote").textContent = "All upcoming Thursdays are sold out or closed. Check back soon."; el("btn").disabled = true; }
}

function loadAvailability(){
  return fetch(API + "?api=availability", { credentials: "omit", cache: "no-store" })
    .then(function(r){ return r.json(); })
    .then(fill)
    .catch(function(){ el("loading").textContent = "Could not load. Please refresh."; });
}

el("f").addEventListener("submit", function(e){
  e.preventDefault();
  var b = el("btn"); b.disabled = true; b.textContent = "Placing order..."; show("", "");
  var o = { date: el("date").value, window: el("window").value, qty: el("qty").value, sauce: el("sauce").value,
            name: el("name").value, phone: el("phone").value, email: el("email").value };
  fetch(API, { method: "POST", credentials: "omit", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(o) })
    .then(function(r){ return r.json(); })
    .then(function(r){
      if (r.ok) { el("f").style.display = "none"; show("ok", r.message); }
      else { show("err", r.message); b.disabled = false; b.textContent = "Place order"; loadAvailability(); }
    })
    .catch(function(){ show("err", "Something went wrong. Please try again."); b.disabled = false; b.textContent = "Place order"; });
});

loadAvailability();
</script>
</body>
</html>
