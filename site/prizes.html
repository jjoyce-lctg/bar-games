<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My prizes | Last Call Tavern Games</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=__BUILD__">
<style>
  body { background: radial-gradient(900px 500px at 50% -10%, rgba(255,205,0,.14), transparent 60%), var(--bg); }
  .wrap { max-width: 520px; margin: 0 auto; padding: 1.4rem 1rem 3rem; }
  .top { display: flex; align-items: center; gap: .7rem; margin-bottom: 1.2rem; }
  .top img { height: 38px; width: 38px; }
  .top b { font-family: var(--display); font-size: 1.4rem; letter-spacing: .05em; font-weight: 400; } .top b span { color: var(--accent); }
  h1 { font-size: 2.4rem; line-height: 1; margin: 0 0 .3rem; } h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 1.2rem; line-height: 1.5; }
  .sec { font-size: .75rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 1.4rem 0 .6rem; }
  .sec.hot { color: var(--accent); }
  .prize { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 1.1rem 1.2rem; margin-bottom: .8rem; }
  .prize.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 14px 40px rgba(255,205,0,.12); background: linear-gradient(180deg, rgba(255,205,0,.08), transparent 60%), var(--panel); }
  .prize.dim { opacity: .62; }
  .prize .venue { font-size: .8rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
  .prize .big { font-family: var(--display); font-size: 2rem; line-height: 1.05; margin: .25rem 0 .3rem; }
  .prize .when { color: var(--muted); font-size: .9rem; }
  .prize .tag { display: inline-block; font-size: .7rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; padding: .2rem .5rem; border-radius: 6px; margin-bottom: .5rem; }
  .tag.active { background: var(--accent); color: #111; } .tag.not_yet { background: #2d6cdf; color: #fff; } .tag.redeemed { background: #2e8b57; color: #fff; } .tag.expired, .tag.voided { background: var(--line); color: var(--muted); }
  .qr { margin: .6rem auto 1.2rem; text-align: center; } .qr svg { width: 150px; height: 150px; background: #fff; padding: 8px; border-radius: 10px; } .qr p { margin: .4rem 0 0; font-size: .85rem; color: var(--muted); }
  .show { margin-top: .7rem; padding: .7rem .9rem; border-radius: 10px; background: rgba(255,205,0,.12); color: #ffe27a; font-weight: 700; font-size: .92rem; }
  .code-row { display: grid; grid-template-columns: 1fr auto; gap: .6rem; }
  input.code { font-size: 1.6rem; letter-spacing: .4em; text-align: center; font-weight: 800; }
  .empty { text-align: center; color: var(--muted); padding: 2rem 1rem; }
  .empty .e { font-size: 3rem; }
  .fine { color: #6f788a; font-size: .78rem; line-height: 1.5; margin-top: 2rem; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="brand/lastcall.png" alt=""><b>LAST CALL <span>TAVERN GAMES</span></b></div>
  <div id="content"><p class="muted">Loading...</p></div>
  <p class="fine">Prizes are valid from the day after they're won, for 14 days, at any Last Call Tavern Group bar. Must be 21+ to claim. One redemption per prize. <a href="index.html">lastcalltaverngames.com</a></p>
</div>

<script src="config.js?v=__BUILD__"></script><script src="vendor/supabase.js?v=__BUILD__"></script><script src="vendor/qrcode.js?v=__BUILD__"></script><script src="common.js?v=__BUILD__"></script>
<script>
(async function () {
  const { api, $, $$, esc, normPhone, fmtPhone } = window.BG;
  const content = $("#content");
  const q = new URLSearchParams(location.search);
  let token = q.get("t"); try { if (!token) token = localStorage.getItem("bg.wallet"); } catch {}
  const fmtDay = (d) => new Date(d).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "America/Chicago" });
  const endDay = (d) => fmtDay(Date.parse(d) - 1);

  function renderWallet(w) {
    try { localStorage.setItem("bg.wallet", token); } catch {}
    const first = (w.name || "").split(" ")[0];
    const ps = w.prizes || [];
    const active = ps.filter((p) => p.status === "active"), soon = ps.filter((p) => p.status === "not_yet"), rest = ps.filter((p) => !["active", "not_yet"].includes(p.status));
    const card = (p) => `<div class="prize ${p.status} ${["active", "not_yet"].includes(p.status) ? "" : "dim"}">
        <span class="tag ${p.status}">${{ active: "Ready to redeem", not_yet: "Starts tomorrow", redeemed: "Claimed", expired: "Expired", voided: "Cancelled" }[p.status] || p.status}</span>
        <div class="venue">${esc(p.venue)} &middot; won ${fmtDay(p.won_at)}</div>
        <div class="big">${esc(p.prize)}</div>
        <div class="when">${p.status === "active" ? `Valid through ${endDay(p.expires_at)}` : p.status === "not_yet" ? `Valid ${fmtDay(p.valid_from)} through ${endDay(p.expires_at)}` : p.status === "redeemed" ? `Claimed ${fmtDay(p.redeemed_at)}${p.redeemed_venue ? ` at ${esc(p.redeemed_venue)}` : ""}` : p.status === "expired" ? `Expired ${endDay(p.expires_at)}` : ""}</div>
        ${p.status === "active" ? `<div class="show">Show this screen to a staff member. They'll look up ${esc(fmtPhone(w.phone))} and redeem it.</div>` : ""}
      </div>`;
    content.innerHTML = `<h1>${first ? `${esc(first.toUpperCase())}'S` : "MY"} <span>PRIZES</span></h1><p class="sub">${esc(fmtPhone(w.phone))} &middot; <a href="prizes.html?edit=1" id="notme">Not you?</a></p>
      ${ps.length ? "" : `<div class="empty"><div class="e">🎲</div><b>No prizes yet.</b><p>Win a game night at any of our bars and it'll show up here.</p></div>`}
      ${active.length ? `<div class="sec hot">Ready to redeem</div>${active.map(card).join("")}<div class="qr">${qrSvg(location.origin + "/staff.html?t=" + encodeURIComponent(token))}<p>Staff can also scan this instead of typing your number.</p></div>` : ""}
      ${soon.length ? `<div class="sec">Starting tomorrow</div>${soon.map(card).join("")}` : ""}
      ${rest.length ? `<div class="sec">Earlier</div>${rest.map(card).join("")}` : ""}`;
    $("#notme").onclick = () => { try { localStorage.removeItem("bg.wallet"); } catch {} };
  }

  function qrSvg(text) { try { const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch { return ""; } }
  function renderLookup(msg) {
    content.innerHTML = `<h1>MY <span>PRIZES</span></h1><p class="sub">Enter the mobile number you play with and we'll text you a code.</p>
      ${msg ? `<div class="error">${esc(msg)}</div>` : ""}
      <div class="stack" id="step1"><div><label>Mobile number</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(312) 555-0123"></div><button id="send" class="btn primary big" style="width:100%">Text me a code</button></div>
      <div class="stack hidden" id="step2"><p class="muted" id="sentTo"></p><div><label>4-digit code</label><input id="code" class="code" inputmode="numeric" maxlength="4" placeholder="0000"></div><button id="verify" class="btn primary big" style="width:100%">Show my prizes</button><p class="muted" style="font-size:.85rem;text-align:center"><a href="#" id="again">Send it again</a></p></div>`;
    const phoneEl = $("#phone"); phoneEl.addEventListener("input", (e) => { const d = normPhone(e.target.value); if (d.length === 10) e.target.value = fmtPhone(d); });
    const send = async () => { const d = normPhone(phoneEl.value); if (d.length !== 10) return renderLookup("Enter your full 10-digit mobile number.");
      $("#send").disabled = true; try { const r = await api.walletRequestCode(d); if (!r.ok) return renderLookup(r.error); } catch (e) { return renderLookup("Couldn't send the code. Check your signal and try again."); }
      $("#step1").classList.add("hidden"); $("#step2").classList.remove("hidden"); $("#sentTo").textContent = `If ${fmtPhone(d)} has played with us, a code is on its way. It expires in 10 minutes.`; $("#code").focus(); };
    $("#send").onclick = send; phoneEl.addEventListener("keydown", (e) => e.key === "Enter" && send());
    $("#again").onclick = (e) => { e.preventDefault(); $("#step2").classList.add("hidden"); $("#step1").classList.remove("hidden"); };
    const verify = async () => { const d = normPhone(phoneEl.value), c = $("#code").value.replace(/\D/g, ""); if (c.length !== 4) return; $("#verify").disabled = true;
      try { const r = await api.walletVerify(d, c); if (!r.ok) { $("#verify").disabled = false; $("#step2").insertAdjacentHTML("afterbegin", `<div class="error">${esc(r.error)}</div>`); return; } token = r.token; const w = await api.walletByToken(token); if (w.ok) renderWallet(w); else renderLookup(w.error); }
      catch (e) { $("#verify").disabled = false; } };
    $("#verify").onclick = verify; $("#code").addEventListener("keydown", (e) => e.key === "Enter" && verify()); $("#code").addEventListener("input", () => { if ($("#code").value.replace(/\D/g, "").length === 4) verify(); });
  }

  if (q.has("edit")) { try { localStorage.removeItem("bg.wallet"); } catch {} token = null; }
  if (token) { try { const w = await api.walletByToken(token); if (w.ok) return renderWallet(w); renderLookup(q.get("t") ? w.error : ""); } catch { renderLookup(""); } }
  else renderLookup("");
})();
</script>
</body>
</html>
